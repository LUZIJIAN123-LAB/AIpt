# =====================================================================
# AIpt — Nginx site config (HTTP-only, IP deploy)
# Place at /etc/nginx/sites-available/aipt and:
#   ln -s /etc/nginx/sites-available/aipt /etc/nginx/sites-enabled/aipt
#   nginx -t && systemctl reload nginx
# When a real domain is available later, swap to nginx.conf + certbot.
# =====================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ---- Frontend SPA (built Vue dist) ----
    root /var/www/aipt;
    index index.html;

    # Static assets — cache aggressively (Vite fingerprints these).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming — CRITICAL: do NOT buffer, do NOT close prematurely.
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600;   # 1h — LLM generation can be slow
        proxy_send_timeout      3600;
        proxy_connect_timeout   30;

        add_header X-Accel-Buffering no always;
        chunked_transfer_encoding on;
    }

    # Health check.
    location /health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
        access_log off;
    }

    # ---- SPA fallback (Vue Router history mode) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

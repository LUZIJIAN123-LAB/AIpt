# =====================================================================
# AIpt — Nginx site config
# Place at /etc/nginx/sites-available/aipt and:
#   ln -s /etc/nginx/sites-available/aipt /etc/nginx/sites-enabled/aipt
#   nginx -t && systemctl reload nginx
# HTTPS is assumed already provisioned via certbot --nginx.
# =====================================================================

server {
    listen 80;
    server_name YOURDOMAIN.COM;
    # Let certbot handle the redirect to HTTPS on first run.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOURDOMAIN.COM;

    # ---- SSL (certbot fills these in) ----
    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.COM/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Frontend SPA (built Vue dist) ----
    root /var/www/aipt;
    index index.html;

    # Static assets — cache aggressively (Vite fingerprints these).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming — CRITICAL: do NOT buffer, do NOT close prematurely.
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600;   # 1h — LLM generation can be slow
        proxy_send_timeout      3600;
        proxy_connect_timeout   30;

        # SSE requires these.
        add_header X-Accel-Buffering no always;
        chunked_transfer_encoding on;
    }

    # Health check — skip proxy overhead.
    location /health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
        access_log off;
    }

    # ---- SPA fallback (Vue Router history mode) ----
    # Any unmatched GET → serve index.html and let client-side routing handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
